name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: DSP tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(dirty630 VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          iscc /DVersion=$ver "/DVst3Dir=$PWD\build\dirty630_artefacts\Release\VST3" /O"$PWD\dist" installer\windows\dirty630.iss

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: dirty630-windows-vst3
          path: build/dirty630_artefacts/Release/VST3/dirty630.vst3
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: dirty630-windows-installer
          path: dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: DSP tests
        run: ctest --test-dir build --output-on-failure

      - name: Installer (pkgbuild)
        run: |
          ver=$(sed -n 's/^project(dirty630 VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          mkdir -p dist
          sh installer/macos/make_pkg.sh build/dirty630_artefacts/Release/VST3/dirty630.vst3 "$ver" "dist/dirty630-$ver-macos.pkg"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: dirty630-macos-vst3
          path: build/dirty630_artefacts/Release/VST3/dirty630.vst3
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: dirty630-macos-installer
          path: dist/*.pkg
          if-no-files-found: error
