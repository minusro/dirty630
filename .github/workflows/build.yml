name: build

on:
  push:
    branches: [main]
    tags: ['v*']          # a tag also publishes a GitHub Release
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(dirty630 VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "VER=$ver" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: DSP tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Installer (Inno Setup)
        shell: pwsh
        run: iscc /DVersion=$env:VER "/DVst3Dir=$PWD\build\dirty630_artefacts\Release\VST3" /O"$PWD\dist" installer\windows\dirty630.iss

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: dirty630-v${{ env.VER }}-windows-vst3
          path: build/dirty630_artefacts/Release/VST3/DIRTY630.vst3
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: dirty630-v${{ env.VER }}-windows-installer
          path: dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: echo "VER=$(sed -n 's/^project(dirty630 VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> $GITHUB_ENV

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: DSP tests
        run: ctest --test-dir build --output-on-failure

      - name: Installer (pkgbuild)
        run: |
          mkdir -p dist
          sh installer/macos/make_pkg.sh build/dirty630_artefacts/Release/VST3/DIRTY630.vst3 "$VER" "dist/dirty630-$VER-macos.pkg"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: dirty630-v${{ env.VER }}-macos-vst3
          path: build/dirty630_artefacts/Release/VST3/DIRTY630.vst3
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: dirty630-v${{ env.VER }}-macos-installer
          path: dist/*.pkg
          if-no-files-found: error

  # Tag pushes only: collect the two installers the jobs above built and
  # attach them to a Release, so there is a download that needs no GitHub
  # account and does not expire the way run artifacts do.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect installers
        uses: actions/download-artifact@v4
        with:
          pattern: '*-installer'
          merge-multiple: true
          path: dist

      - name: Check both installers are present
        run: |
          ls -l dist
          test -n "$(find dist -name '*.pkg' -print -quit)" || { echo "::error::no macOS pkg"; exit 1; }
          test -n "$(find dist -name '*.exe' -print -quit)" || { echo "::error::no Windows exe"; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Unsigned builds. Your operating system will block the installer the"
            echo "first time — the [README](https://github.com/$GITHUB_REPOSITORY#install)"
            echo "has the steps for getting past that on macOS and on Windows."
            echo
            echo "- **macOS**: \`dirty630-*-macos.pkg\` — installs to \`/Library/Audio/Plug-Ins/VST3\`"
            echo "- **Windows**: \`dirty630-*-windows.exe\` — installs to \`C:\\Program Files\\Common Files\\VST3\`"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "DIRTY630 ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --generate-notes
